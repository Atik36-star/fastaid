<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="csrf-token" content="<?php require_once __DIR__ . '/../includes/config.php'; require_once __DIR__ . '/../includes/csrf.php'; session_name(SESSION_NAME); session_start(); echo csrf_token(); ?>"><title>Volunteer Dashboard — FastAid</title><link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/legacy.css"></head><body class="legacy-page volunteer-page">
<nav class="navbar legacy-dashboard-nav" aria-label="Main"><div class="nav-inner"><a href="index.html" class="logo">Fast<span>Aid</span></a><button class="hamburger" onclick="toggleNav()" aria-label="Toggle" aria-expanded="false"><span></span><span></span><span></span></button><div class="nav-links" id="navLinks"><a href="volunteer-dashboard.html" class="active">Dashboard</a><a href="focus.html">Focus Mode</a><a href="request.html">New Request</a><a href="login.html" onclick="logoutUser(event)">Logout</a></div></div></nav>
<main class="legacy-dashboard-content" aria-label="Volunteer Dashboard">
  <h2 style="margin-bottom:24px;">Dashboard</h2>
  <div class="notice-banner" style="background:#e8f5e9;border-left-color:#2a7a2a;">You have 2 incoming requests. Verification pending — new accepts disabled until verified.</div>

  <section aria-label="Availability"><div style="display:flex;align-items:center;gap:12px;margin-bottom:20px;"><h2>Availability</h2><label style="cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:8px;"><input type="checkbox" id="availToggle" checked onchange="updateAvail()"> Available</label></div><button onclick="openModal('dndModal')" class="btn btn-outline">Set Do Not Disturb Hours</button></section>

  <section aria-label="Incoming requests"><h2>Incoming Requests</h2>
    <div id="incomingList"></div>
  </section>

  <section aria-label="Notifications" style="margin-top:30px;"><h2>Notifications</h2><div class="card"><ul id="vNotif" style="list-style:none;"></ul></div></section>
</main>

<div class="modal-overlay" id="dndModal"><div class="modal"><button onclick="closeModal('dndModal')" aria-label="Close" style="float:right;background:none;border:none;font-size:1.2rem;cursor:pointer;">×</button><div class="card-icon">&#9670;</div><h3>Do Not Disturb Hours</h3><form onsubmit="setDND(event)"><div class="form-group"><label for="dndStart">Start</label><input type="time" id="dndStart" value="22:00"></div><div class="form-group"><label for="dndEnd">End</label><input type="time" id="dndEnd" value="07:00"></div><button type="submit" class="btn btn-red" style="width:100%;">Save</button></form></div></div>

<script src="assets/js/main.js"></script><script src="assets/js/api.js"></script><script src="assets/js/mock-data.js"></script>
<script>
function toggleNav(){const l=document.getElementById('navLinks');l.classList.toggle('open');document.querySelector('.hamburger').setAttribute('aria-expanded',l.classList.contains('open'))}
function logoutUser(e){e.preventDefault();api.logout().then(r=>{if(r.success)window.location='login.html';else showToast(r.error||'Logout failed.','error');});}
document.addEventListener('DOMContentLoaded',()=>{api.get_incoming_requests().then(r=>{if(r.success){const c=document.getElementById('incomingList');(r.data.requests||[]).forEach((req,i)=>{const card=document.createElement('div');card.className='card';card.innerHTML='<div class="card-icon">&#9670;</div><h4>'+escapeHtml(req.type)+'</h4><p>'+escapeHtml(req.description||'')+'</p><button type="button" data-request-index="'+i+'" class="btn btn-red" style="margin-top:6px;" '+(MOCK_USERS.filter(u=>u.id===2)[0]&&!MOCK_USERS.filter(u=>u.id===2)[0].verified?'disabled':'')+'>Accept</button>';c.appendChild(card);});c.addEventListener('click',event=>{const button=event.target.closest('button[data-request-index]');if(button)acceptReq(r.data.requests[Number(button.dataset.requestIndex)].id);});}});api.get_notifications().then(r=>{if(r.success){const list=document.getElementById('vNotif');(r.data.notifications||[]).forEach(n=>{const li=document.createElement('li');li.style.padding='10px 0';li.innerHTML='<strong>'+escapeHtml(n.text)+'</strong> <span style="font-size:0.75rem;color:#999;">'+escapeHtml(n.time)+'</span>';list.appendChild(li);});}});});
function updateAvail(){api.update_availability({available:document.getElementById('availToggle').checked}).then(r=>showToast(r.success?'Availability updated':'Failed','success'))}
function acceptReq(id){api.accept_request({id}).then(r=>{if(r.success){showToast('Request accepted');window.location='focus.html';}});}
function setDND(e){e.preventDefault();api.set_dnd_hours({start:document.getElementById('dndStart').value,end:document.getElementById('dndEnd').value}).then(()=>{showToast('DND set');closeModal('dndModal');});}
</script><script src="assets/js/auth-guard.js"></script></body></html>
